name: Multiplatform Release Build

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.artifact_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows (x64 & x86)
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: redragon_m719_pro.exe
            artifact_name: redragon_m719_pro-windows-x64.exe
          - os: windows-latest
            target: i686-pc-windows-msvc
            bin_name: redragon_m719_pro.exe
            artifact_name: redragon_m719_pro-windows-x86.exe

          # Linux (x64 & x86)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: redragon_m719_pro
            artifact_name: redragon_m719_pro-linux-x64
          - os: ubuntu-latest
            target: i686-unknown-linux-gnu
            bin_name: redragon_m719_pro
            artifact_name: redragon_m719_pro-linux-x86

          # macOS (Intel x64 & Apple Silicon arm64)
          - os: macos-latest
            target: x86_64-apple-darwin
            bin_name: redragon_m719_pro
            artifact_name: redragon_m719_pro-macos-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_name: redragon_m719_pro
            artifact_name: redragon_m719_pro-macos-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain (${{ matrix.target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux x64 system dependencies
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libudev-dev \
            libhidapi-dev \
            libgtk-3-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev

      - name: Install Linux x86 (32-bit) multilib dependencies
        if: matrix.target == 'i686-unknown-linux-gnu'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            gcc-multilib \
            g++-multilib \
            pkg-config:i386 \
            libc6-dev:i386 \
            libudev-dev:i386

      - name: Build release binary
        shell: bash
        env:
          PKG_CONFIG_ALLOW_CROSS: 1
          PKG_CONFIG_PATH: ${{ matrix.target == 'i686-unknown-linux-gnu' && '/usr/lib/i386-linux-gnu/pkgconfig' || '' }}
        run: |
          cargo build --release --bin redragon_m719_pro --target ${{ matrix.target }}
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "dist/${{ matrix.artifact_name }}"

      - name: Upload standardized binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}
