[package]
name = "redragon_m719_pro"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.29.1"
egui = "0.29.1"
egui_extras = { version = "0.29.1", features = ["image"] }
image = { version = "0.25.1", default-features = false, features = ["png", "ico", "bmp"] }
rfd = "0.15.2"
hidapi = "2.6.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
windows = { version = "0.58.0", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation"
] }
