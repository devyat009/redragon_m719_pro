[package]
name = "redragon_m719_pro"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.29.1", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui = "0.29.1"
egui_extras = { version = "0.29.1", features = ["image"] }
image = { version = "0.25.1", default-features = false, features = ["png", "ico", "bmp"] }
rfd = "0.15.2"
hidapi = "2.6.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4.45"

[target.'cfg(not(all(target_os = "linux", target_arch = "x86")))'.dependencies]
tray-icon = "0.26.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58.0", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_Security"
] }

[build-dependencies]
image = { version = "0.25.1", default-features = false, features = ["png", "ico"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"


